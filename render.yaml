services:
  - type: web
    name: resqroute-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false            # e.g. https://your-site.netlify.app
      - key: DB_PATH
        value: /data/resqroute.db
    disk:                      # persistent SQLite (needs a paid Render instance; free tier storage is ephemeral)
      name: resqroute-data
      mountPath: /data
      sizeGB: 1
